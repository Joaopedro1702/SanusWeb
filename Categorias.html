                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                <span class="carrinho-badge">2</span>

            <button class="btnHeader">MENU</button>
        </div>
    </header>

    <!-- NAV -->
    <nav class="categorias">
        <a href="#">INÍCIO</a>
        <a href="#" class="ativo">PRODUTOS</a>
        <a href="#">AJUDA</a>
        <a href="#">TRABALHE CONOSCO</a>
        <a href="#">CONTATO</a>
    </nav>

    <!--Conteúdo Principal-->
    <section class="lista-produtos"></section>
    <footer>

    </footer>

</html>

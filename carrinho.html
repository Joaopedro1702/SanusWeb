<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/stylePadrao.css">
    <link rel="stylesheet" href="css/styleLoginCadastro.css">
    <link rel="stylesheet" href="css/carrinho.css">
    <title>Login</title>
</head>
    <header class="topo">
        <img src="imagens/SanusLogo.webp" alt="Logo da Sanus." id="logo">
        <button class="btnHeader" onclick="window.location.href='#'">MENU</button>
    </header>
<body>
    <main class="carrinho-page">
        <h1>SEU CARRINHO</h1>

        <section class="lista-carrinho" aria-label="Produtos no carrinho">
            <article class="item-carrinho">
                <img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=320&q=80" alt="Cartelas de remédio">

                <div class="item-info">
                    <h2>REMÉDIO PARA DOR DE CABEÇA</h2>
                    <p>DOMINE A SUA CONFEITARIA.</p>
                </div>

                <strong class="preco">R$ 0,00</strong>
            </article>

            <article class="item-carrinho">
                <img src="https://images.unsplash.com/photo-1512069772995-ec65ed45afd6?auto=format&fit=crop&w=320&q=80" alt="Cápsulas e frasco de medicamento">

                <div class="item-info">
                    <h2>Remédio para problemas</h2>
                    <p>Guia completo.</p>
                </div>

                <strong class="preco">R$ 0,00</strong>
            </article>

            <article class="item-carrinho">
                <img src="https://images.unsplash.com/photo-1471864190281-a93a3070b6de?auto=format&fit=crop&w=320&q=80" alt="Vários comprimidos coloridos">

                <div class="item-info">
                    <h2>KIT PRIMEIROS DE SOCORROS</h2>
                    <p>Massas de longa fermentação e bordas recheadas.</p>
                </div>

                <strong class="preco">R$ 0,00</strong>
            </article>
        </section>
    </main>

    <footer class="resumo-carrinho">
        <div class="total">
            <span>TOTAL DO CARRINHO</span>
            <strong>R$ 0,00</strong>
        </div>

        <a href="#" class="finalizar-compra">
            FINALIZAR COMPRA
            <span aria-hidden="true">→</span>
        </a>
    </footer>
</body>
</html>
